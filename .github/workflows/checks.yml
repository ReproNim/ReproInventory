name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data-and-schema:
    name: Validate data against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install linkml pyyaml requests

      - name: Validate data against the LinkML schema
        run: linkml-validate -s model/reproinventory_schema.yaml -C ReproInventoryEntry model/reproinventory_data.yaml

      - name: Run tests (schema sync, issue processing)
        run: python -m unittest discover -s tests -v

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build
