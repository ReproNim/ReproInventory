name: Create PR from Issue

# Turns an "Add / Edit / Delete material" issue (opened from the website) into a
# pull request against the inventory data. Runs once per issue. The type of
# change is taken from the issue label or, if GitHub dropped the label (it does
# for contributors without triage rights), from the issue title.
#
# To reprocess an issue (e.g. after fixing the AI settings), use "Run workflow"
# on the Actions tab and enter the issue number. The issue's branch is rebuilt
# from main and its existing PR is updated, so no duplicate entries or PRs.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to (re)process
        required: true

concurrency:
  group: create-pr-from-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.issue.title, 'Add material:')
      || startsWith(github.event.issue.title, 'Edit material:')
      || startsWith(github.event.issue.title, 'Delete material:')
      || contains(github.event.issue.labels.*.name, 'new-material')
      || contains(github.event.issue.labels.*.name, 'edit-material')
      || contains(github.event.issue.labels.*.name, 'delete-material')

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Read issue and determine the type of change
        run: |
          gh issue view "$ISSUE_NUMBER" --json title --jq .title > /tmp/issue_title.txt
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > /tmp/issue_body.txt
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name] | join(",")')
          TITLE=$(cat /tmp/issue_title.txt)

          case ",$LABELS," in
            *,new-material,*)    ISSUE_LABEL=new-material ;;
            *,edit-material,*)   ISSUE_LABEL=edit-material ;;
            *,delete-material,*) ISSUE_LABEL=delete-material ;;
            *)
              case "$TITLE" in
                "Add material:"*)    ISSUE_LABEL=new-material ;;
                "Edit material:"*)   ISSUE_LABEL=edit-material ;;
                "Delete material:"*) ISSUE_LABEL=delete-material ;;
                *) echo "Issue #$ISSUE_NUMBER is not a material submission; nothing to do."; exit 1 ;;
              esac ;;
          esac
          echo "ISSUE_LABEL=$ISSUE_LABEL" >> "$GITHUB_ENV"
          echo "BRANCH=auto/issue-$ISSUE_NUMBER" >> "$GITHUB_ENV"
          echo "Issue #$ISSUE_NUMBER: $ISSUE_LABEL"

      - name: Process issue and update files
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL || secrets.AI_API_URL || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o-mini' }}
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS || '1000' }}
          PR_BODY_PATH: /tmp/pr_body.md
        run: python .github/scripts/process_issue.py

      - name: Push branch and open or update the PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always start the issue's branch fresh from main, so reprocessing
          # replaces the previous attempt instead of stacking entries.
          git checkout -B "$BRANCH"
          git add model/reproinventory_data.yaml frontend/public/data/reproinventory_data.json
          if git diff --cached --quiet; then
            echo "No changes detected - nothing to commit."
            exit 1
          fi
          TITLE=$(cat /tmp/issue_title.txt)
          git commit -m "$TITLE" -m "Closes #$ISSUE_NUMBER"
          git push --force origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file /tmp/pr_body.md
            echo "Updated PR #$EXISTING"
          else
            gh pr create --title "$TITLE" --body-file /tmp/pr_body.md --base main --head "$BRANCH"
          fi
