name: Create PR from Issue

on:
  issues:
    types: [opened, labeled]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: >
      contains(fromJSON('["new-material", "edit-material", "delete-material"]'), github.event.label.name)
      || contains(join(github.event.issue.labels.*.name, ','), 'new-material')
      || contains(join(github.event.issue.labels.*.name, ','), 'edit-material')
      || contains(join(github.event.issue.labels.*.name, ','), 'delete-material')

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Write issue data to files
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/issue_body.txt
          printf '%s' "$ISSUE_TITLE" > /tmp/issue_title.txt

      - name: Prepare issue branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABEL: ${{ contains(join(github.event.issue.labels.*.name, ','), 'new-material') && 'new-material' || contains(join(github.event.issue.labels.*.name, ','), 'edit-material') && 'edit-material' || contains(join(github.event.issue.labels.*.name, ','), 'delete-material') && 'delete-material' || github.event.label.name }}
        run: |
          BRANCH="auto/${ISSUE_LABEL}-issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune

          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          else
            git checkout -B "$BRANCH"
          fi

      - name: Process issue and update files
        env:
          ISSUE_LABEL: ${{ contains(join(github.event.issue.labels.*.name, ','), 'new-material') && 'new-material' || contains(join(github.event.issue.labels.*.name, ','), 'edit-material') && 'edit-material' || contains(join(github.event.issue.labels.*.name, ','), 'delete-material') && 'delete-material' || github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o-mini' }}
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS || '250' }}
        run: python .github/scripts/process_issue.py

      - name: Create branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABEL: ${{ contains(join(github.event.issue.labels.*.name, ','), 'new-material') && 'new-material' || contains(join(github.event.issue.labels.*.name, ','), 'edit-material') && 'edit-material' || contains(join(github.event.issue.labels.*.name, ','), 'delete-material') && 'delete-material' || github.event.label.name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="${BRANCH:-auto/${ISSUE_LABEL}-issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}}"
          git add model/reproinventory_data.yaml frontend/public/data/reproinventory_data.json
          if git diff --cached --quiet; then
            echo "No changes detected — nothing to commit."
            exit 1
          fi
          git commit -m "${ISSUE_TITLE}"
          git fetch --all --prune
          git push --set-upstream origin "$BRANCH" --force-with-lease
          PR_BODY=$(printf "Closes #%s\n\nAutomatically generated from issue #%s." "${ISSUE_NUMBER}" "${ISSUE_NUMBER}")
          gh pr create \
            --title "${ISSUE_TITLE}" \
            --body "${PR_BODY}" \
            --base main \
            --head "${BRANCH}"
