id: http://example.org/reproinventory
name: reproinventory
description: A LinkML schema for ReproInventory data

prefixes:
  linkml: https://w3id.org/linkml/
  reproinv: http://example.org/reproinventory/

default_prefix: reproinv
default_range: string

imports:
  - linkml:types

enums:
  LevelEnum:
    permissible_values:
      Beginner:
      Intermediate:
      Advanced:
      NA:
  PlatformEnum:
    permissible_values:
      Mac:
      Windows:
      Linux:
      Docker:
      Jupyter:
      NA:
  CourseLengthEnum:
    permissible_values:
      "<1 hr":
      "1-4 hrs":
      "1 day":
      "1-3 days":
      "1 week":
      "1+ weeks":
      NA:
  ContentFormatEnum:
    permissible_values:
      Hands-on tutorial / notebooks:
      lecture:
      video:
      notes:
      blog post:
      reference:
      slides:
      website:
      outline:
      meta-resource:
      NA:
  DeliveryEnum:
    permissible_values:
      self-paced:
      instructor:
      Hybrid:
  LanguageEnum:
    permissible_values:
      English:
      French:
      Spanish:
      Chinese:
      German:
      "English, French":
      "English, German":
      Other:
      NA:
  ProgrammingLanguageEnum:
    permissible_values:
      Python:
      R:
      "shell scripting":
      Matlab:
      Git:
      NA:
  NeuroimagingSoftwareEnum:
    permissible_values:
      AFNI:
      SPM:
      FSL:
      Freesurfer:
      Python:
      Multiple:
      NA:
  ImagingModalityEnum:
    permissible_values:
      DWI:
      Structural:
      Functional:
      "Task-based":
      "Resting-State":
      EEG:
      Behavioral:
      MEG:
      MRI:
      NA:

classes:
  ReproInventoryEntry:
    slots:
      - id
      - tag_team
      - course_name
      - url
      - level
      - platform
      - keywords
      - course_length
      - instruction_medium
      - delivery
      - language
      - programming_language
      - neuroimaging_software
      - imaging_modality
      - open_dataset
      - last_updated
      - functionality
      - assessment
      - prerequisite
      - source
      - description
      - review
      - exclude_from_repro_inventory
      - alias_links
      - notes
      - quadrant_weights

  QuadrantWeights:
    description: >-
      How strongly a resource serves each of the four Diataxis purposes
      (https://diataxis.fr), from 0 (not at all) to 3 (mainly). Together the
      scores place the resource on two axes: practical (tutorial, how-to) vs
      theoretical (explanation, reference), and study (tutorial, explanation)
      vs work (how-to, reference).
    attributes:
      tutorial:
        description: Learning-oriented - guides a learner through doing something.
        range: integer
        minimum_value: 0
        maximum_value: 3
      how_to:
        description: Task-oriented - steps to solve a specific problem.
        range: integer
        minimum_value: 0
        maximum_value: 3
      explanation:
        description: Understanding-oriented - background, concepts and reasoning.
        range: integer
        minimum_value: 0
        maximum_value: 3
      reference:
        description: Information-oriented - lookup material such as documentation or command references.
        range: integer
        minimum_value: 0
        maximum_value: 3

slots:
  id:
    identifier: true
    range: integer
  tag_team:
    range: string
    multivalued: true
  course_name:
    range: string
  url:
    range: string
  level:
    range: LevelEnum
    multivalued: true
  platform:
    range: PlatformEnum
    multivalued: true
  keywords:
    range: string
    multivalued: true
  course_length:
    range: CourseLengthEnum
  instruction_medium:
    range: ContentFormatEnum
    multivalued: true
  delivery:
    range: DeliveryEnum
    multivalued: true
  language:
    range: LanguageEnum
    multivalued: true
  programming_language:
    range: ProgrammingLanguageEnum
    multivalued: true
  neuroimaging_software:
    range: NeuroimagingSoftwareEnum
    multivalued: true
  imaging_modality:
    range: ImagingModalityEnum
    multivalued: true
  open_dataset:
    description: Whether the resource uses openly available data.
    range: boolean
  last_updated:
    range: string # Can be date, but '2023' values suggest string is safer
  functionality:
    range: string
  assessment:
    range: boolean
  prerequisite:
    range: string
    multivalued: true
  source:
    range: string
    multivalued: true
  description:
    description: A short summary of what the resource covers.
    range: string
  review:
    range: string
  exclude_from_repro_inventory:
    range: boolean
  alias_links:
    range: string
  notes:
    range: string
  quadrant_weights:
    description: Diataxis profile of the resource, scored 0-3 per quadrant.
    range: QuadrantWeights
    inlined: true